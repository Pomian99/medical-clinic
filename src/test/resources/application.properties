spring.datasource.url=jdbc:h2:mem:clinic
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never

spring.main.banner-mode=off
logging.level.root=WARN

# This file replaces the main application.properties in tests, so the page size limit is
# repeated here: without it tests would see Spring's default cap (2000), not ours.
spring.data.web.pageable.max-page-size=100

# The schema history is repeated here for the same reason: without it Liquibase looks for
# db/changelog/db.changelog-master.yaml and tests that start the whole context fail. With it
# H2 gets its schema from the same history as PostgreSQL, and Hibernate validates it.
spring.liquibase.change-log=classpath:liquibase-changelog/liquibase-changelog.yaml
spring.jpa.hibernate.ddl-auto=validate
