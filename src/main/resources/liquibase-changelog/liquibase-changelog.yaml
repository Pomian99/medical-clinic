# Remaining gap: the unique (doctor_id, starts_at) from 005 stops two visits of the same doctor
# that start at the same time, also when two requests race. Overlaps that start at different
# times (10:00-10:30 and 10:15-10:45) are still checked only by VisitService, so two concurrent
# requests can both pass that check. A PostgreSQL exclusion constraint on the doctor's time
# range would close it too, but H2 used in tests does not support it.
