databaseChangeLog:
  - changeSet:
      id: "18"
      author: kursant
      changes:
        - sql:
            sql: >-
              ALTER TABLE users ADD CONSTRAINT users_role_check
              CHECK (role IN ('PATIENT', 'DOCTOR'))
        - sql:
            sql: >-
              ALTER TABLE doctors ADD CONSTRAINT doctors_specialization_check
              CHECK (specialization IN ('CARDIOLOGIST', 'DERMATOLOGIST', 'PEDIATRICIAN'))
      rollback:
        - sql:
            sql: ALTER TABLE doctors DROP CONSTRAINT doctors_specialization_check
        - sql:
            sql: ALTER TABLE users DROP CONSTRAINT users_role_check
