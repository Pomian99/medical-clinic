spring.application.name=medical-clinic

spring.datasource.url=jdbc:postgresql://localhost:5432/clinic
spring.datasource.username=clinic
spring.datasource.password=clinic

# Spring Boot runs data.sql on its own only for embedded databases such as H2.
# PostgreSQL is not one, so it has to be switched on explicitly.
spring.sql.init.mode=always

# Liquibase builds the schema from the change log. Hibernate only checks that the entities
# match it and refuses to start when they do not.
spring.liquibase.change-log=classpath:liquibase-changelog/liquibase-changelog.yaml
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true

# The page size comes from the client, and the client is not trusted: ?size=100000000 would
# turn the paged list back into findAll(). Spring silently caps a larger request at this
# value (its own default cap is 2000).
spring.data.web.pageable.max-page-size=100

# The trailing space after ] separates the request id from the logger name: keep it.
logging.pattern.correlation=[%X{requestId}] 
logging.file.name=logs/medical-clinic.log
