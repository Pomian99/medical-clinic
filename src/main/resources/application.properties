spring.application.name=medical-clinic

spring.datasource.url=jdbc:postgresql://localhost:5432/clinic
spring.datasource.username=clinic
spring.datasource.password=clinic

# Spring Boot runs data.sql on its own only for embedded databases such as H2.
# PostgreSQL is not one, so it has to be switched on explicitly.
spring.sql.init.mode=always

# The schema is generated from the entity classes. `update` adds missing tables and
# columns but never drops any: a removed or renamed field leaves its old column behind.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Run data.sql after Hibernate has created the tables, not before.
spring.jpa.defer-datasource-initialization=true
