info:
  name: Sort By Start Ascending
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/visits?sort=startsAt,asc"
  params:
    - name: sort
      value: startsAt,asc
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("visits are sorted by startsAt ascending", function () {
          const starts = res.body.content.map((visit) => visit.startsAt);
          expect(starts.length).to.be.above(1);
          for (let i = 1; i < starts.length; i++) {
            expect(starts[i] >= starts[i - 1]).to.equal(true);
          }
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
