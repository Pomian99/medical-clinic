info:
  name: Sort By Password Rejected
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/visits?sort=patient.user.password"
  params:
    - name: sort
      value: patient.user.password
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.detail
      operator: contains
      value: "allowed: startsAt, endsAt, id"

docs: The password field exists on the entity, but it is not on the sort whitelist.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
