info:
  name: List Visits Of Unknown Patient
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/visits/patient/-1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.detail
      operator: eq
      value: "Patient with id -1 not found"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Expected 404 Not Found. An unknown patient is not the same as a patient without visits, who gets an empty list.
