info:
  name: List Doctor Visits
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/visits?doctorId=1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
