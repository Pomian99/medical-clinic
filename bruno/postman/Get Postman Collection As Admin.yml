info:
  name: Get Postman Collection As Admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/postman/patients"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: application/json

docs: The Postman export of this collection, served from the application jar. Only the admin may download it.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
