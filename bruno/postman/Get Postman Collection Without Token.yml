info:
  name: Get Postman Collection Without Token
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/postman/patients"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

docs: No token at all gives 401, not 403.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
