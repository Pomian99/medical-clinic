info:
  name: Get Postman Collection As Patient
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/postman/patients"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

docs: Anna's token is valid, but GET /postman/** is for ADMIN only, so the role decides.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
