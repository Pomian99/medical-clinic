info:
  name: Get Doctor With Facility
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/doctors/1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.facilities
      operator: contains
      value: "Przychodnia Krowodrza"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
