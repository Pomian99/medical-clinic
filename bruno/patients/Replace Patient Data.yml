info:
  name: Replace Patient Data
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/patients/{{patientId}}"
  body:
    type: json
    data: |-
      {
        "firstName": "Piotr",
        "lastName": "Zieliński-Nowak",
        "phoneNumber": "600100201",
        "birthday": "1992-07-15"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
