info:
  name: Remove Patient By Id
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/patients/{{patientId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
