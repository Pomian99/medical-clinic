info:
  name: Get Patient By Email
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/patients?email=piotr.zielinski@example.com"
  params:
    - name: email
      value: piotr.zielinski@example.com
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
