info:
  name: List Patients
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/patients"
  auth:
    type: basic
    username: "{{adminEmail}}"
    password: "{{adminPassword}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
