info:
  name: Update Password
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{baseUrl}}/patients/{{patientId}}/password"
  body:
    type: json
    data: |-
      {
        "password": "NewSecret#2026"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
