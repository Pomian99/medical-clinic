info:
  name: Create Second Slot
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/visits"
  body:
    type: json
    data: |-
      {
        "doctorId": 1,
        "startsAt": "2030-02-11T11:00:00",
        "endsAt": "2030-02-11T11:30:00"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("secondSlotId", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
