info:
  name: Create Substitute
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/doctors"
  body:
    type: json
    data: |-
      {
        "userId": {{substituteUserId}},
        "firstName": "Paweł",
        "lastName": "Kaczmarek",
        "specialization": "CARDIOLOGIST"
      }
  auth:
    type: basic
    username: "{{adminEmail}}"
    password: "{{adminPassword}}"

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("substituteId", res.getBody().id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
