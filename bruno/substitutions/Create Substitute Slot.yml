info:
  name: Create Substitute Slot
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/visits"
  body:
    type: json
    data: |-
      {
        "doctorId": {{substituteId}},
        "startsAt": "2030-02-11T11:00:00",
        "endsAt": "2030-02-11T11:30:00"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

docs: The substitute's own visit at the time of the second slot, so the substitution fails there.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
