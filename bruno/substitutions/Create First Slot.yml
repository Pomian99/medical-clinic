info:
  name: Create First Slot
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/visits"
  body:
    type: json
    data: |-
      {
        "doctorId": 1,
        "startsAt": "2030-02-11T10:00:00",
        "endsAt": "2030-02-11T10:30:00"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("firstSlotId", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

docs: The substitute is free at 10:00, so this visit is moved before the conflict is found.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
