info:
  name: Get Removed User
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/users/{{userId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
