info:
  name: Remove User Not Found
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{baseUrl}}/users/-1"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
