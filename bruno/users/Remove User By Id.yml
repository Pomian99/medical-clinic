info:
  name: Remove User By Id
  type: http
  seq: 8

http:
  method: DELETE
  url: "{{baseUrl}}/users/{{userId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

docs: Removes the account made by "Create User", so the folder can be run again.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
