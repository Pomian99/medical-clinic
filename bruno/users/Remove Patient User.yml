info:
  name: Remove Patient User
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{baseUrl}}/users/{{patientUserId}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

docs: Uses the account id saved by "Get User By Email" (Jan Wiśniewski, a patient).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
