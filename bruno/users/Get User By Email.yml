info:
  name: Get User By Email
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/users?email=jan.wisniewski@example.com"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("patientUserId", res.getBody().id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.role
      operator: eq
      value: PATIENT

docs: |-
  Jan Wiśniewski is a patient from data.sql. His account id is saved for "Remove Patient User".

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
