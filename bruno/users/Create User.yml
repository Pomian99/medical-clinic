info:
  name: Create User
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/users"
  body:
    type: json
    data: |-
      {
        "email": "adam.lis@example.com",
        "password": "Secret#123",
        "role": "DOCTOR"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("userId", res.getBody().id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.password
      operator: isUndefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
