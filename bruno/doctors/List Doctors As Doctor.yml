info:
  name: List Doctors As Doctor
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/doctors"
  auth:
    type: bearer
    token: "{{doctorToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

docs: The DOCTOR role does not give access to the doctor list. GET /doctors is for ADMIN only (MED-16).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
