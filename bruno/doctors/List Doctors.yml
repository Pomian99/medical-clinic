info:
  name: List Doctors
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/doctors"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
