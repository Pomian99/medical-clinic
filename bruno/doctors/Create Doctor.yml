info:
  name: Create Doctor
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/doctors"
  body:
    type: json
    data: |-
      {
        "userId": {{doctorUserId}},
        "firstName": "Tomasz",
        "lastName": "Mazur",
        "specialization": "DERMATOLOGIST"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
