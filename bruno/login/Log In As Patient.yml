info:
  name: Log In As Patient
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/token"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("token", res.getBody().token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: Logs in as Anna Nowak (PATIENT). The token is saved in "token", which the collection sends by default.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
