info:
  name: Log In With Wrong Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/token"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "wrong-password"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "401"
    - expression: res.body.detail
      operator: eq
      value: "wrong e-mail or password"

docs: A wrong password and an unknown e-mail get the same answer, so the response does not tell which accounts exist.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
