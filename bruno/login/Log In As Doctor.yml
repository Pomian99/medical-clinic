info:
  name: Log In As Doctor
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/token"
  body:
    type: json
    data: |-
      {
        "email": "{{doctorEmail}}",
        "password": "{{doctorPassword}}"
      }

runtime:
  scripts:
    - type: after-response
      code: bru.setVar("doctorToken", res.getBody().token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

docs: Logs in as Dr Katarzyna Wróbel (DOCTOR). The token is saved in "doctorToken" for assigning a doctor to a facility.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
