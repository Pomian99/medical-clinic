info:
  name: Get User By Id
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users/1"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "1"
    - expression: res.body.username
      operator: eq
      value: "Bret"

docs: |-
  One account by id.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
