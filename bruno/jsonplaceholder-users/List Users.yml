info:
  name: List Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray
    - expression: res.body.length
      operator: eq
      value: "10"

docs: |-
  The ten fake accounts of JSONPlaceholder, a public test API. Run this folder with the test environment.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
