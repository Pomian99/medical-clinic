info:
  name: Get User Not Found
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/users/999"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

docs: |-
  An unknown id gives 404 with an empty object.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
